# Replaces nginx's default site. Every file is revalidated on each load (a cheap 304 when unchanged), so a redeploy
# reaches phones and Cloudflare at once instead of mixing a new index.html with hours-old scripts.
server {
    listen 80;
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache" always;
    location / {
        try_files $uri $uri/ =404;
    }
}
